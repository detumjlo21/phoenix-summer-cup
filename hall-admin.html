<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>Quản lý Hall of Champions</title>
  <link rel="stylesheet" href="styles.css?v=41">
</head>
<body>
  <div class="background-grid"></div>

  <main class="page">
    <header class="hero compact">
      <a href="admin.html" class="hall-back-link">← Trang quản trị</a>
      <p class="eyebrow">PHOENIX ADMIN</p>
      <h1>Hall of Champions</h1>
      <p class="subtitle">Lưu đội vô địch và MVP của từng mùa giải.</p>
    </header>

    <p id="hallAdminMessage" class="message" aria-live="polite"></p>

    <section class="panel">
      <p class="eyebrow">LƯU MÙA GIẢI</p>
      <h2>Tạo bản ghi vô địch</h2>
      <p class="muted">Chọn đội vô địch và MVP, sau đó bấm lưu.</p>

      <form id="saveSeasonForm" class="hall-admin-form">
        <label for="seasonLabel">Tên mùa</label>
        <input id="seasonLabel" value="Mùa 1" maxlength="60" required>

        <label for="tournamentName">Tên giải</label>
        <input id="tournamentName" value="Phoenix Summer Cup 2026" maxlength="100" required>

        <label for="championTeamSelect">🏆 Đội vô địch</label>
        <select id="championTeamSelect" class="hall-select" required>
          <option value="">Đang tải danh sách đội...</option>
        </select>

        <div id="selectedChampionPreview" class="hall-selection-preview"></div>

        <label for="seasonMvpSelect">👑 MVP mùa giải</label>
        <select id="seasonMvpSelect" class="hall-select" required>
          <option value="">Đang tải danh sách tuyển thủ...</option>
        </select>

        <div id="selectedMvpPreview" class="hall-selection-preview"></div>

        <label for="seasonDate">Ngày kết thúc</label>
        <input id="seasonDate" type="date" required>

        <label for="seasonBanner">Banner mùa giải (không bắt buộc)</label>
        <input id="seasonBanner" type="file" accept="image/png,image/jpeg,image/webp">

        <button id="saveSeasonBtn" type="submit">🏆 Lưu mùa giải</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-row">
        <div>
          <p class="eyebrow">DỮ LIỆU ĐÃ LƯU</p>
          <h2>Các mùa giải</h2>
        </div>
      </div>

      <div id="seasonAdminList" class="season-admin-list"></div>
    </section>

    <footer>
      <a href="champions.html">Xem Hall of Champions</a>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=41"></script>
  <script src="toast.js?v=41"></script>
  <script src="hall-admin.js?v=41"></script>
</body>
</html>
